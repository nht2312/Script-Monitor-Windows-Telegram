name: Build Native Go EXE

# Build WinMonitor.exe (Go native) - it bi antivirus bao nham, khong can Python.
# Build ca amd64 + arm64, chay test, ky so (neu co secrets), checksum, artifact & release.
on:
  push:
    branches: [ main ]
    paths:
      - "windows-native/**"
      - ".github/workflows/build-go-exe.yml"
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        working-directory: windows-native
        run: go test ./...

      - name: Build amd64
        working-directory: windows-native
        shell: pwsh
        run: |
          $env:GOOS="windows"; $env:GOARCH="amd64"; $env:CGO_ENABLED="0"
          go build -trimpath -ldflags="-s -w -H windowsgui" -o WinMonitor.exe .

      - name: Build arm64
        working-directory: windows-native
        shell: pwsh
        run: |
          $env:GOOS="windows"; $env:GOARCH="arm64"; $env:CGO_ENABLED="0"
          go build -trimpath -ldflags="-s -w -H windowsgui" -o WinMonitor-arm64.exe .

      - name: Decode signing cert
        if: ${{ secrets.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String("${{ secrets.CODE_SIGN_PFX_BASE64 }}"))

      - name: Sign EXEs (nếu có chứng chỉ)
        if: ${{ secrets.CODE_SIGN_PFX_BASE64 != '' }}
        working-directory: windows-native
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.CODE_SIGN_PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 WinMonitor.exe
          & $signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.CODE_SIGN_PFX_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 WinMonitor-arm64.exe

      - name: Checksums
        working-directory: windows-native
        shell: pwsh
        run: |
          Get-FileHash WinMonitor.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  WinMonitor.exe" } | Set-Content SHA256SUMS.txt
          Get-FileHash WinMonitor-arm64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  WinMonitor-arm64.exe" } | Add-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload amd64
        uses: actions/upload-artifact@v4
        with:
          name: WinMonitor-native-amd64
          path: |
            windows-native/WinMonitor.exe
            windows-native/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: WinMonitor-native-arm64
          path: windows-native/WinMonitor-arm64.exe
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-native/WinMonitor.exe
            windows-native/WinMonitor-arm64.exe
            windows-native/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
